# XcodeGen project manifest — Tier E (test infrastructure) + Tier F (Domain
# package).
#
# Generates HermesTouchBar.xcodeproj via:
#   xcodegen generate
# Then run the formal test target:
#   xcodebuild test -project HermesTouchBar.xcodeproj -scheme HermesTouchBarTests \
#     -destination 'platform=macOS'
#
# Scope note: this manifest covers the FORMAL TEST TARGET only. Since Tier F
# the pure-logic layer lives in the local SwiftPM package `Domain/`
# (HermesDomain), and the test target depends on it — it no longer compiles
# production sources inline. The app itself still builds via scripts/build.sh
# (swiftc + the private-API ObjC bridge), because the DFRFoundation/dlopen
# bridge doesn't fit an ordinary Xcode app target yet. Keeping the test target
# free of AppDelegate / TouchBarController means `xcodebuild test` never
# touches the private API.

name: HermesTouchBar

options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  HermesDomain:
    path: Domain

targets:
  HermesTouchBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - tests/unit
    dependencies:
      - package: HermesDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermestouchbar.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # Tests run locally; no signing needed for a unit-test bundle.
        CODE_SIGNING_ALLOWED: "NO"
        OTHER_LDFLAGS:
          - "-lsqlite3"

schemes:
  HermesTouchBarTests:
    build:
      targets:
        HermesTouchBarTests: all
    test:
      targets:
        - name: HermesTouchBarTests
